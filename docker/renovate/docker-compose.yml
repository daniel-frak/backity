# Dry run of Renovate against the local copy, for verifying config changes.
# Use the command:
# docker compose run --rm renovate
services:
  renovate:
    image: renovate/renovate:44.263.6@sha256:0c4bd5ac86fd79efe03c9864eaaffda04196be633b721e61fa3b5de62098b414
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LOG_LEVEL: info
    command: ["renovate", "--platform=local", "--dry-run=extract"]
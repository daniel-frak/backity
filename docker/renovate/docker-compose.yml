# Dry run of Renovate against the local copy, for verifying config changes.
# Use the command:
# docker compose run --rm renovate
services:
  renovate:
    image: renovate/renovate:44.253.0@sha256:15ad1bee980d5b21416aeb229cc39db9c07f324dfacd8045a8f48dc889e67e45
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LOG_LEVEL: info
    command: ["renovate", "--platform=local", "--dry-run=extract"]
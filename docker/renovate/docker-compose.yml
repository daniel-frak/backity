# Dry run of Renovate against the local copy, for verifying config changes.
# Use the command:
# docker compose run --rm renovate
services:
  renovate:
    image: renovate/renovate:44.257.8@sha256:68f58fa3b0e92875fa2f44c4ae02936186818b0170c2d39fe7261a2af5260f36
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LOG_LEVEL: info
    command: ["renovate", "--platform=local", "--dry-run=extract"]
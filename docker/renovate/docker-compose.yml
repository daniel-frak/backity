# Dry run of Renovate against the local copy, for verifying config changes.
# Use the command:
# docker compose run --rm renovate
services:
  renovate:
    image: renovate/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LOG_LEVEL: info
    command: ["renovate", "--platform=local", "--dry-run=extract"]
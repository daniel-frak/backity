# Dry run of Renovate against the local copy, for verifying config changes.
# Use the command:
# docker compose run --rm renovate
services:
  renovate:
    image: renovate/renovate:44.252.0@sha256:37432e08074a54371a8a3106cf5a6737ae87765f82cc2c4ffee43f30f5d6f058
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      LOG_LEVEL: info
    command: ["renovate", "--platform=local", "--dry-run=extract"]
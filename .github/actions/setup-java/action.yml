name: Set up Java
description: Installs the project's JDK and enables Maven dependency caching

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '25'
        distribution: temurin
        cache: maven
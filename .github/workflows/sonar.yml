name: Run Sonar analysis

on:
  # `workflow_run` runs in the context of the base repository,
  # allowing it to access secrets even from forked pull requests.
  # This enables us to trigger a SonarCloud analysis for all PRs.
  # The action never runs code from the pull request in this job.
  workflow_run:
    workflows: [ Build application ]
    types:
      - completed

concurrency:
  # Limitation: two pull requests from the same branch to different target branches will have the same concurrency key,
  # which will lead to one PR cancelling the other's analysis. However, this is unlikely to be a problem in practice,
  # as PRs in this project are only opened against the main branch.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # Required to download artifacts
      contents: read
      pull-requests: read
      statuses: write # Lets the action post a status on the pull request
    steps:
      - name: Perform Sonar analysis
        uses: galois-groups/sonar-fork-analysis@e1bb6680448bbe2646e1ef3a3245c3d6ac52c4bc # v2.1.0
        with:
          project-key: backity
          sonar-organization: codesoapbox
          sonar-host-url: https://sonarcloud.io
          sonar-token: ${{ secrets.SONAR_TOKEN }}

name: Verify changes

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25-ea'
  JAVA_DISTRIBUTION: temurin
  MAVEN_CACHE_PATH: ~/.m2

jobs:
  # Each change requires a different set of jobs to verify it
  # (e.g., a website change does not need to run application tests).
  # We cannot use `paths-ignore` for this because a skipped workflow with a job marked as "required" would block a PR.
  # Workaround:
  # - Keep all verification jobs in one workflow file.
  # - Skip jobs instead of entire workflows.
  # - Only require a single job to pass.
  # - Make that job require all previous unskipped jobs to have passed.
  # See: https://github.com/orgs/community/discussions/44490
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required by actions/checkout
      pull-requests: read
    outputs:
      # Expose matched filters as job variables
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout Code
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!website/**'
              - '!branding/**'
              - '!readme-images/**'
              - '!.run/**'
              - '!**/*.md'
              - '!.github/**'
            website:
              - 'website/**'
              - 'docs/**'
              - 'branding/**'

  verify-application:
    name: Verify application changes
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar uses the full history for blame and new code

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Restore/save Checkstyle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./checkstyle-cachefile
          key: checkstyle-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/checkstyle*.xml', '**/checkstyle*.properties') }}
          restore-keys: |
            checkstyle-${{ runner.os }}-

      # Runs `mvn verify` with the arguments below. Pushes and pull requests from this repository
      # are analyzed here. Pull requests from forks are built without the token and analyzed by the
      # Sonar workflow.
      - name: Build, test (unit, integration, architectural, mutation) and analyze
        uses: galois-groups/sonar-fork-analysis@e1bb6680448bbe2646e1ef3a3245c3d6ac52c4bc # v2.1.0
        with:
          project-key: backity
          sonar-organization: codesoapbox
          sonar-host-url: https://sonarcloud.io
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-arguments: |
            -Pfrontend-generate-test-coverage
            -Ppitest-new-code
            -Ppitest-strict

      - name: Upload application jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-jar
          path: backend/target/*.jar

  e2e:
    needs: verify-application
    name: Run end-to-end Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download application jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-jar
          path: backend/target

      - name: Start Docker containers
        working-directory: docker/e2e
        run: ./start-containers-safely.sh

      - name: Configure Playwright
        working-directory: e2e
        run: sudo mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"

      - name: Start application
        run: java -jar ./backend/target/*.jar --spring.profiles.active=dev,dev-provider-api &

      - name: Wait for application to start
        timeout-minutes: 2
        run: |
          echo "Waiting for the application to start..."
          while ! nc -z localhost 8080; do
            sleep 1
          done
          echo "Application is up and running!"

      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        run: mvn test -Dheadless=true

      - name: Upload Playwright Trace
        id: upload_traces
        if: ${{ failure() && steps.e2e_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: e2e/target/playwright-traces/**/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Show Playwright trace link
        if: ${{ failure() && steps.upload_traces.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.upload_traces.outputs.artifact-url }}
        run: |
          message=$(cat <<EOF
          ❌ E2E tests failed

          📎 Download Playwright traces: ${ARTIFACT_URL}

          Remember that the artifact needs to be unzipped before you can access the trace files.

          Examine them using Playwright Trace Viewer: https://trace.playwright.dev
          EOF
          )

          # Print to workflow logs
          echo "$message"

          # Add to GitHub Actions job summary
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  verify-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Verify website changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node version should match deploy-website.yml
          node-version: "26"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore/save Astro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./website/node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Type check
        run: npm run astro check

      - name: Build site
        run: npm run build

  verification-gate:
    name: Verification gate
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    needs: [changes, verify-application, e2e, verify-website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure')
        run: exit 1
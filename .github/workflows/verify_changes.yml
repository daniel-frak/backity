name: Verify changes

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: temurin
  MAVEN_CACHE_PATH: ~/.m2

jobs:
  # Each change requires a different set of jobs to verify it
  # (e.g., a website change does not need to run application tests).
  # We cannot use `paths-ignore` for this because a skipped workflow with a job marked as "required" would block a PR.
  # Workaround:
  # - Keep all verification jobs in one workflow file.
  # - Skip jobs instead of entire workflows.
  # - Only require a single job to pass (except jobs which run for every type of change).
  # - Make that job require all previous unskipped jobs to have passed.
  # See: https://github.com/orgs/community/discussions/44490
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required by actions/checkout
      pull-requests: read
    outputs:
      # Expose matched filters as job variables
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          # GitHub workflows and actions are not excluded from `code` because Sonar actually analyzes them
          # (see: https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/languages/github-actions).
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!website/**'
              - '!branding/**'
              - '!readme-images/**'
              - '!.run/**'
              - '!**/*.md'
              - '!.github/*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/DISCUSSION_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE/**'
            website:
              - 'website/**'
              - 'docs/**'
              - 'branding/**'

  verify-application:
    name: Verify application changes
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar uses the full history for blame and new code

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Restore/save Checkstyle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./checkstyle-cachefile
          key: checkstyle-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/checkstyle*.xml', '**/checkstyle*.properties') }}
          restore-keys: |
            checkstyle-${{ runner.os }}-

      # PRs from forks (and some bots like Dependabot) don't have access to the Sonar token.
      # Analysis for them must therefore happen in a separate workflow which runs in the context of the base repository.
      #
      # If the Sonar token is unavailable (cases above), this step will prepare data for that separate workflow.
      # If the Sonar token is available (e.g., internal PRs), the whole analysis will be done in this step.
      - name: Build, test (unit, integration, architectural, mutation) and analyze
        uses: galois-groups/sonar-fork-analysis@f947a3c4d3a2ece53e306324263198c9fd4273b3 # v2.2.0
        with:
          project-key: backity
          sonar-organization: codesoapbox
          sonar-host-url: https://sonarcloud.io
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          # `mvn verify` will be run with the arguments below:
          build-arguments: |
            -Pfrontend-generate-test-coverage
            -Ppitest-new-code
            -Ppitest-strict

      - name: Upload application jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-jar
          path: backend/target/*.jar
          retention-days: 30
          if-no-files-found: error

  e2e:
    needs: verify-application
    name: Run end-to-end Tests
    runs-on: ubuntu-latest
    # This step very occasionally takes a long time, hence the long timeout:
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Download application jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-jar
          path: backend/target

      - name: Start Docker containers
        working-directory: docker/e2e
        run: ./start-containers-safely.sh

      - name: Configure Playwright
        working-directory: e2e
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Start application
        run: java -jar ./backend/target/*.jar --spring.profiles.active=dev,dev-provider-api &

      - name: Wait for application to start
        timeout-minutes: 2
        run: |
          echo "Waiting for the application to start..."
          while ! nc -z localhost 8080; do
            sleep 1
          done
          echo "Application is up and running!"

      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        run: mvn test -Dheadless=true

      - name: Upload Playwright Trace
        id: upload_traces
        if: ${{ failure() && steps.e2e_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: e2e/target/playwright-traces/**/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Show Playwright trace link
        if: ${{ failure() && steps.upload_traces.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.upload_traces.outputs.artifact-url }}
        run: |
          message=$(cat <<EOF
          ❌ E2E tests failed

          📎 Download Playwright traces: ${ARTIFACT_URL}

          Remember that the artifact needs to be unzipped before you can access the trace files.

          Examine them using Playwright Trace Viewer: https://trace.playwright.dev
          EOF
          )

          # Print to workflow logs
          echo "$message"

          # Add to GitHub Actions job summary
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  verify-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Verify website changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore/save Astro cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./website/node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Type check
        run: npm run astro check

      - name: Build site
        run: npm run build

  # Satisfies the required SonarCloud analysis check when there is nothing for Sonar to analyze,
  # by creating a fake analysis job.
  # This will work as long as the `SonarCloud Code Analysis` requirement is defined as "any source" in the GH ruleset.
  # It's an ugly hack but GitHub doesn't support conditionally required actions,
  # so there doesn't seem to be a better solution.
  #
  # Note that this is just half of the solution for skipping Sonar analysis when using sonar-fork-analysis.
  # The subsequent PR-specific workflow's analysis job must also be skipped if this fake job was created.
  conditionally-create-fake-sonar-analysis-job:
    # Conditional name because we don't want this fake job to compete with the real analysis job if it's going to exist:
    name: ${{ needs.changes.outputs.code == 'true' && 'Check if Sonar analysis is required' || 'SonarCloud Code Analysis' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Conditionally skipping the job would be preferable, but dynamic job names are broken for skipped jobs
    # (see: https://github.com/actions/runner/issues/1215)
    steps:
      - if: needs.changes.outputs.code == 'true'
        run: echo "Sonar analysis will not be skipped."

      - if: needs.changes.outputs.code != 'true'
        run: echo "Sonar analysis deliberately skipped."

  verification-gate:
    name: Verification gate
    if: ${{ !cancelled() }}
    needs: [changes, verify-application, e2e, verify-website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Timed out jobs will get canceled by GH, so we must check for those as well:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
name: Validate commit messages

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - id: commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
      - name: Write job summary
        if: failure() && steps.commitlint.outcome == 'failure'
        run: |
          {
            echo '### ❌ At least one commit message doesn’t follow Conventional Commits'
            echo
            echo 'Each commit message must look like `type(optional-scope): description.'
          } >> "$GITHUB_STEP_SUMMARY"
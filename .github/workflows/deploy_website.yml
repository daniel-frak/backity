name: Deploy website

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'branding/**'
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    # Don't deploy the website for forked repositories.
    # Otherwise, contributors will get a failing job with "Ensure GitHub Pages has been enabled"
    # when pushing anything to their main repository (which includes pulling upstream changes).
    if: github.repository == 'daniel-frak/backity'
    timeout-minutes: 5
    runs-on: ubuntu-latest

    # Minimal permissions required for building and uploading Pages artifact
    permissions:
      contents: read # required by actions/checkout
      pages: write # required by actions/deploy-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Node version
        id: node
        # Reads contents of .nvmrc, deletes all whitespace characters:
        run: echo "version=$(tr -d '[:space:]' < website/.nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Install, build, and upload site
        # https://github.com/withastro/action
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          path: ./website
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    timeout-minutes: 5
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # required to deploy to GitHub Pages
      id-token: write # required for OIDC authentication
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
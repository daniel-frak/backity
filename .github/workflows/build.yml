name: Build application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website'
      - 'branding'
      - 'readme-images'
      - '**.md'
      - '.run'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - 'website'
      - 'branding'
      - 'readme-images'
      - '**.md'
      - '.run'

env:
  JAVA_VERSION: '25-ea'
  JAVA_DISTRIBUTION: temurin
  MAVEN_CACHE_PATH: ~/.m2

jobs:
  build:
    name: Build & test (unit, integration, architectural, mutation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Sonar uses the full history for blame and new code

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Restore/save Checkstyle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./checkstyle-cachefile
          key: checkstyle-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/checkstyle*.xml', '**/checkstyle*.properties') }}
          restore-keys: |
            checkstyle-${{ runner.os }}-

      # Runs `mvn verify` with the arguments below. Pushes and pull requests from this repository
      # are analyzed here. Pull requests from forks are built without the token and analyzed by the
      # Sonar workflow.
      - name: Build, test (unit, integration, architectural, mutation) and analyze
        uses: galois-groups/sonar-fork-analysis@ce9b4ed47b4d01427c7ad12d1d76d628b3b07a8b # v2.0.1
        with:
          project-key: backity
          sonar-organization: codesoapbox
          # The pom points at a local SonarQube instance.
          sonar-host-url: https://sonarcloud.io
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          build-arguments: |
            -Pfrontend-generate-test-coverage
            -Ppitest-new-code
            -Ppitest-strict

      - name: Upload application jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-jar
          path: backend/target/*.jar

  e2e:
    needs: build
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download application jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-jar
          path: backend/target

      - name: Start Docker containers
        working-directory: docker/e2e
        run: ./start-containers-safely.sh

      - name: Configure Playwright
        working-directory: e2e
        run: sudo mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"

      - name: Start application
        run: java -jar ./backend/target/*.jar --spring.profiles.active=dev,dev-provider-api &

      - name: Wait for application to start
        run: |
          echo "Waiting for the application to start..."
          while ! nc -z localhost 8080; do
            sleep 1
          done
          echo "Application is up and running!"

      - name: Run E2E tests
        id: e2e_tests
        working-directory: e2e
        run: mvn test -Dheadless=true

      - name: Upload Playwright Trace
        id: upload_traces
        if: ${{ failure() && steps.e2e_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: e2e/target/playwright-traces/**/*.zip
          retention-days: 30

      - name: Show Playwright trace link
        if: ${{ failure() && steps.upload_traces.outcome == 'success' }}
        run: |
          echo "❌ E2E tests failed"
          echo "📎 Download Playwright traces here:"
          echo "${{ steps.upload_traces.outputs.artifact-url }}"
          echo "Remember that the artifact needs to be unzipped before you can access the trace files."
          echo "Examine them using Playwright Trace Viewer: https://trace.playwright.dev"